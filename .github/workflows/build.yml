name: Crear APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extraer proyecto
        run: |
          unzip -q ProgrentisAyudanteV2_Burbuja_Android.zip
          cd ProgrentisAyudanteV2
          echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: cd "$PROJECT_DIR" && gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Ayudante-flotante-APK
          path: ProgrentisAyudanteV2/app/build/outputs/apk/debug/app-debug.apk
